[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
crash = { workspace = true, optional = true }
versionlib.workspace = true

[features]
# The minidump decoder (`cargo xtask crash`); off by default so the generator never depends on the code it generates.
decode = ["dep:crash"]

[lints]
workspace = true
