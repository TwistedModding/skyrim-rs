# cargo-about configuration for scripts/notices.ps1. MIT comes first so dual-licensed crates are noticed with
# their MIT text, which carries the copyright line.
accepted = ["MIT", "Apache-2.0", "BSD-2-Clause", "Zlib", "Unicode-3.0"]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# The crate wraps the MinHook C library, compiled in by its build script; MinHook's notice also covers the bundled
# Hacker Disassembler Engine.
[minhook.clarify]
license = "MIT AND BSD-2-Clause"
files = [
    { path = "LICENSE", license = "MIT", checksum = "81053d86dc61a9744c0bab79674e6864ef206c0084caf1cf7f8a9db7c12efd24" },
    { path = "minhook/LICENSE.txt", license = "BSD-2-Clause", checksum = "4f21f857550d7be854da6ea5f2da4e6775ca4e3fbb535e4f3d961c47d0bf3335" },
]

# Published without license files, so the text comes from the repository. egui's crates were published from a
# commit that is not on GitHub, so the 0.37.0 tag's commit stands in for it.
[ecolor.clarify]
license = "MIT OR Apache-2.0"
override-git-commit = "841a328ba2dd8f6996beb7189ebb7fc00e668a2a"
git = [{ path = "LICENSE-MIT", license = "MIT", checksum = "95ca92f5f8ea5231f1580b3a2a799e8260af3114b900e1def5355a7f44bcf60c" }]

