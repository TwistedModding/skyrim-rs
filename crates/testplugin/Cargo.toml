[package]
name = "testplugin"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "skyrim_rs_test"
crate-type = ["cdylib"]

[dependencies]
skse.workspace = true
hook.workspace = true
sre = { workspace = true, features = ["bgs", "tes"] }
skyrim = { workspace = true, features = ["actors", "animation", "audio", "camera", "events", "forms", "input", "papyrus", "render", "save", "ui"] }
overlay.workspace = true
crash.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
