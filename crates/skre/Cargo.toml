# Generated by `cargo xtask gen`, which also names the features after the groups; do not edit.
[package]
name = "skre"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
skse.workspace = true
versionlib.workspace = true

# A group's feature compiles its methods, free functions and global accessors; a tier feature adds,
# in every enabled group, the functions typed only by a decompiler prototype of that rating.
