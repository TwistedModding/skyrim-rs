[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
skse = { path = "crates/skse", version = "0.1.0" }
versionlib = { path = "crates/versionlib", version = "0.1.0" }
hook = { path = "crates/hook", version = "0.1.0" }
layout = { path = "crates/layout", version = "0.1.0" }
skyrim = { path = "crates/skyrim", version = "0.1.0" }
overlay = { path = "crates/overlay", version = "0.1.0" }
framework = { path = "crates/framework", version = "0.1.0" }
crash = { path = "crates/crash", version = "0.1.0" }
windows-sys = "0.61"
windows = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"
